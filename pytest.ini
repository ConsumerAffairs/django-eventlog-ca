[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=eventlog
    --cov-report=term-missing
    --cov-report=html
    --ignore=eventlog/migrations
testpaths = tests
norecursedirs = migrations
